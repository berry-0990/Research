<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Research Paper Viewer</title>

  <style>
    body{
      margin:0;
      background:#0f0f0f;
      font-family:Arial, sans-serif;
      color:white;
      text-align:center;
    }

    h1{
      padding:20px;
      color:#76b3ff;
    }

    .pdf-container{
      width:100%;
      height:90vh;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
    }
  </style>
</head>
<body>

  <h1>My Research Paper</h1>

  <div class="pdf-container">
    
    <!-- Replace research.pdf with your PDF file name -->
    <iframe src="CARAG.pdf"></iframe>

  </div>

</body>
</html>
